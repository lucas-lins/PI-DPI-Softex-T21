<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #ffffff;
            width: 380px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #0066cc;
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #bcd4ff;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004c99;
        }

        .mensagem {
            text-align: center;
            color: green;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cadastro</h2>

    <label>Nome Completo</label>
    <input type="text" id="nome" required>

    <label>Data de Nascimento</label>
    <input type="date" id="dataNascimento">

    <label>Idade</label>
    <input type="number" id="idade" readonly>

    <label>CPF</label>
    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14">

    <label>CRM do Médico</label>
    <input type="text" id="crm">

    <button onclick="cadastrar()">Cadastrar</button>

    <div class="mensagem" id="msgSucesso">
        Cadastro realizado com sucesso!
    </div>
</div>

<script>
    // Define a data máxima como hoje (impede datas futuras)
    const hoje = new Date().toISOString().split("T")[0];
    document.getElementById("dataNascimento").setAttribute("max", hoje);

    // Calcula idade automaticamente ao selecionar a data
    document.getElementById("dataNascimento").addEventListener("change", function () {
        const dataNasc = new Date(this.value);
        const dataAtual = new Date();

        let idade = dataAtual.getFullYear() - dataNasc.getFullYear();
        const mes = dataAtual.getMonth() - dataNasc.getMonth();

        if (mes < 0 || (mes === 0 && dataAtual.getDate() < dataNasc.getDate())) {
            idade--;
        }

        document.getElementById("idade").value = idade;
    });

    // Máscara de CPF
    document.getElementById("cpf").addEventListener("input", function () {
        let cpf = this.value.replace(/\D/g, "");
        cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
        cpf = cpf.replace(/(\d{3})(\d)/, "$1.$2");
        cpf = cpf.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        this.value = cpf;
    });

    function cadastrar() {
        const dados = {
            nome: document.getElementById("nome").value,
            dataNascimento: document.getElementById("dataNascimento").value,
            idade: document.getElementById("idade").value,
            cpf: document.getElementById("cpf").value,
            crm: document.getElementById("crm").value
        };

        if (!dados.nome || !dados.dataNascimento || !dados.cpf || !dados.crm) {
            alert("Preencha todos os campos!");
            return;
        }

        // Salva no localStorage
        localStorage.setItem("cadastroMedico", JSON.stringify(dados));

        document.getElementById("msgSucesso").style.display = "block";

        // Limpa formulário
        document.querySelectorAll("input").forEach(input => input.value = "");
    }
</script>

</body>
</html>
